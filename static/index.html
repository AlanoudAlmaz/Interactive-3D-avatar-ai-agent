<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zayed · ADCMC Digital Employee</title>
  <meta name="theme-color" content="#050a14">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/zayed.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs",
      "pdfjs": "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.es.mjs",
      "mediapipe": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20/vision_bundle.mjs"
    }
  }
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span>Z</span></div>
      <div class="brand-text">
        <div class="brand-name"><span data-i18n="brand">Zayed</span><span class="brand-sep">·</span><span class="brand-org" data-i18n="org">ADCMC</span></div>
        <div class="brand-role" data-i18n="role">Digital Employee</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="pill" id="kbButton" type="button">
        <span class="pill-icon" data-icon="shield"></span>
        <span class="pill-label" id="kbLabel" data-i18n="knowledge">Verified knowledge</span>
      </button>
      <button class="icon-btn" id="voiceToggle" type="button" data-i18n-title="voiceOn"></button>
      <button class="icon-btn" id="statusButton" type="button" data-i18n-title="status"></button>
      <button class="lang-btn" id="langToggle" type="button" data-i18n="langToggle">العربية</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Zayed">
      <div class="holo" id="holo">
        <div class="holo-halo" aria-hidden="true"></div>
        <div class="holo-ring" aria-hidden="true"></div>
        <div class="holo-avatar" id="avatar"></div>
        <div class="holo-fallback" id="avatarFallback" hidden aria-hidden="true"><span>Z</span></div>
        <div class="holo-scan" aria-hidden="true"></div>
        <div class="holo-base" aria-hidden="true"></div>
      </div>
      <div class="presence">
        <div class="state" id="state" data-state="loading">
          <span class="state-dot"></span>
          <span class="state-label" id="stateLabel" data-i18n="state_loading">Starting</span>
        </div>
        <p class="caption" id="caption" dir="auto" aria-live="polite"></p>
        <div class="stage-controls">
          <button class="mic-btn" id="micButton" type="button" data-i18n-title="tapToSpeak">
            <span class="mic-wave" aria-hidden="true"></span>
            <span class="mic-icon" data-icon="mic"></span>
          </button>
          <button class="stop-btn" id="stopButton" type="button" hidden>
            <span data-icon="stop"></span><span data-i18n="stop">Stop</span>
          </button>
        </div>
        <div class="stage-hint" id="stageHint" data-i18n="tapToSpeak">Tap to speak</div>
      </div>
    </section>

    <aside class="chat" aria-label="Conversation">
      <div class="chat-head">
        <h2 data-i18n="conversation">Conversation</h2>
        <button class="text-btn" id="clearChat" type="button" data-i18n="clear">Clear</button>
      </div>
      <div class="messages" id="messages" aria-live="polite">
        <div class="welcome" id="welcome">
          <h3 data-i18n="welcomeTitle">How can I help you today?</h3>
          <p data-i18n="welcomeBody"></p>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>
      <div class="attachments" id="attachments"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button class="icon-btn ghost" id="attachButton" type="button" data-i18n-title="attach"></button>
        <input type="file" id="fileInput" multiple hidden
               accept=".pdf,.docx,.pptx,.xlsx,.xlsm,.csv,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.markdown,.json">
        <textarea id="input" rows="1" dir="auto" data-i18n-placeholder="placeholder" maxlength="4000"></textarea>
        <button class="icon-btn ghost" id="composerMic" type="button" data-i18n-title="mic"></button>
        <button class="send-btn" id="sendButton" type="submit" data-i18n-title="send" disabled></button>
      </form>
    </aside>
  </main>

  <div class="workspace" id="workspace"></div>
  <div class="dock" id="dock"></div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div class="drop-card">
      <span data-icon="upload"></span>
      <strong data-i18n="dropHere">Drop files to upload</strong>
      <small data-i18n="dropHint"></small>
    </div>
  </div>

  <div class="drawer" id="kbDrawer" hidden>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="kbTitle">
      <div class="drawer-head">
        <h2 id="kbTitle" data-i18n="knowledge">Verified knowledge</h2>
        <button class="icon-btn ghost" type="button" data-close data-i18n-title="close"></button>
      </div>
      <div class="drawer-body" id="kbList"></div>
    </div>
  </div>

  <div class="popover" id="statusPopover" hidden role="dialog"></div>
  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.42.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js" defer></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
